    <circle cx="210" cy="270" r="54" fill="#10b981" />
    <path d="M190 270 L204 284 L232 254" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Sparkle Stars for Cleanliness -->
    <path d="M70 240 Q75 255 90 260 Q75 265 70 280 Q65 265 50 260 Q65 255 70 240 Z" fill="#38bdf8" />
    <path d="M100 200 Q103 210 113 213 Q103 216 100 226 Q97 216 87 213 Q97 210 100 200 Z" fill="#38bdf8" opacity="0.8" />
